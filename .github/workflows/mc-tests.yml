# The slow gate: builds the test addons and runs their GameTests on a real Bedrock
# Dedicated Server. Kept off every-push because it downloads a ~200 MB server and takes minutes;
# opt in with the `run-mc-tests` label on a PR, or let it run on main.
#
# Build and server tooling install from npm.
name: GameTests (BDS)

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: mc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-mc-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
        with:
          path: server

      # setup-node's Yarn cache invokes `yarn` during the action, so Corepack
      # must select the packageManager-pinned Yarn before setup-node starts.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - run: yarn install --immutable

      - name: Read the pinned server version
        id: bds
        run: echo "version=$(jq -r .version bds-runner.json)" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved version alone, not on a file hash, so an unrelated edit to
      # bds-runner.json cannot invalidate a 200 MB download.
      - name: Cache Bedrock Dedicated Server
        uses: actions/cache@v6
        with:
          path: server/.bds/cache
          key: bds-${{ runner.os }}-${{ steps.bds.outputs.version }}

      - run: yarn bds:fetch

      # Both fixtures are loaded into one world for cross-pack discovery checks.
      - name: GameTests
        run: yarn test:mc

      # The server console is the only debugging surface for a CI failure, so keep it either way.
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bds-logs
          path: server/.bds/logs/**
          if-no-files-found: warn
          retention-days: 14
