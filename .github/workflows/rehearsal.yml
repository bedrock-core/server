# Release rehearsal: publish every package to a throwaway local registry and
# install each one from a clean consumer, proving version ranges and tarball
# dependencies resolve. Never touches registry.npmjs.org (reads are proxied,
# writes stay on localhost).
#
# The rehearsal script lives in the ui repo and is run against the checkouts side
# by side, because this repo's portal: resolutions require sibling `ui` and
# `bds-runner` checkouts.
name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Publish flow to rehearse
        type: choice
        options: [changeset, yarn]
        default: changeset

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: server

      - uses: actions/checkout@v7
        with:
          repository: bedrock-core/ui
          path: ui

      - uses: actions/checkout@v7
        with:
          repository: bedrock-core/bds-runner
          path: bds-runner

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - name: Run rehearsal
        run: >
          node ui/scripts/release-rehearsal.mjs
          --ui-root "$GITHUB_WORKSPACE/ui"
          --server-root "$GITHUB_WORKSPACE/server"
          --publisher "${{ inputs.publisher }}"
