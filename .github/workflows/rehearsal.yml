# Release rehearsal: publish every package to a throwaway local registry and
# install each one from a clean consumer, proving version ranges and tarball
# dependencies resolve. Never touches registry.npmjs.org (reads are proxied,
# writes stay on localhost).
#
# The rehearsal script lives in the (public) ui repo and is run against both
# checkouts side by side, because this repo's portal: resolutions require a
# sibling ui checkout. Once the portals are dropped (post first release), this
# can gain a pull_request trigger.
name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Publish flow to rehearse
        type: choice
        options: [changeset, yarn]
        default: changeset

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: server-public

      - uses: actions/checkout@v4
        with:
          repository: bedrock-core/ui
          path: ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Run rehearsal
        run: >
          node ui/scripts/release-rehearsal.mjs
          --ui-root "$GITHUB_WORKSPACE/ui"
          --server-root "$GITHUB_WORKSPACE/server-public"
          --publisher "${{ inputs.publisher }}"
